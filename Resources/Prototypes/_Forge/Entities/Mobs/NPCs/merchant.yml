# MARK: Торговцы (merchant NPCs)
# Неподвижные NPC трёх тиров: клик по ним открывает окно торговли.
# Ассортимент собирается из пула наборов n14MerchantStockSet (merchant_tiers.yml):
# записи всех перечисленных наборов объединяются, и торговец случайно набирает
# stockSize позиций. Ассортимент обновляется каждые restockSeconds секунд
# (по умолчанию 1200 = 20 минут).
# Выкупленные у игрока вещи остаются в продаже и после обновления ассортимента.
# Крышки в запасе роллятся случайно при появлении на карте.

# MARK: Тир 1 — дешёвое снаряжение, калибры до 7.62
- type: startingGear
  id: N14MerchantGearT1
  equipment:
    jumpsuit: N14ClothingUniformJumpsuitTrader
    shoes: N14ClothingBootsCowboy
    head: N14ClothingHeadHatCowboyBrown
    outerClothing: N14ClothingOuterCoatDuster

- type: entity
  parent: N14MobHumanWastelander
  id: N14MobHumanMerchant
  name: Местный торговец
  description: Вчерашний обитатель пустоши. Продает легко доступное оружие и слабую броню.
  components:
    - type: Icon
      sprite: _Nuclear14/Markers/Jobs/wastelanders.rsi
      state: wastelander
    - type: RandomHumanoidAppearance
      randomizeName: true
    - type: Loadout
      prototypes: [N14MerchantGearT1]
    - type: NpcFactionMember
      factions:
      - CaravanCompany
    # Неподвижность: статичное тело, игрок не может утащить/поднять/обыскать.
    - type: Physics
      bodyType: Static
    - type: RemoveComponents
      components:
        - Strippable
        - Pullable
        - Carriable
    # Бессмертие.
    - type: Godmode
    - type: N14Merchant
      merchantName: Merchant
      capsMin: 2000
      capsMax: 4000
      stockSets:
        - N14MerchantStockT1Combat
        - N14MerchantStockT1Travel
        - N14MerchantStockT1Utility
      stockSize: 10
      restockSeconds: 1200
    - type: ActivatableUI
      key: enum.N14MerchantUiKey.Key
    - type: UserInterface
      interfaces:
        enum.N14MerchantUiKey.Key:
          type: N14MerchantBoundUserInterface

