# MARK: Наборы товаров торговцев (merchant stock sets)
# Каждый набор — 10 позиций: оружие ближнего боя, стрелковое, броня, одежда,
# шлем, росток, патроны, руда, материал, хлам.
# Все наборы одного тира объединяются в пул торговца: при появлении и каждые
# 20 минут он случайно набирает из пула stockSize (по умолчанию 10) позиций.
# Цена 0 = взять из N14MerchantPrices.
# ВАЖНО: не добавлять дубли id прототипов внутри одного документа YAML.

