# Raider assault trigger items (admin/event tools), one per attack point.
# Using one in hand announces the raid and spawns raiders from the matching spawners.
# Mirrors N14VertibirdCrashTrigger.

- type: entity
  parent: BaseItem
  id: N14RaiderAssaultTriggerNorth
  name: радиомаяк нападения (Северный перевал)
  description: Передаёт рейдерам приказ атаковать Северный перевал.
  components:
  - type: Sprite
    sprite: Objects/Misc/flare.rsi
    layers:
    - state: flare_base
      color: "#b33939"
  - type: Item
    size: Small
    sprite: Objects/Misc/flare.rsi
  - type: N14RaiderAssaultTrigger
    attackPointId: north_pass

