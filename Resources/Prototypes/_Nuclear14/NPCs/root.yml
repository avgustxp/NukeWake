- type: htnCompound
  id: N14TurretCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyGunTargets
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: RangedRange
            - !type:TargetInLOSPrecondition
              targetKey: Target
              rangeKey: RangedRange
          operator: !type:GunOperator
            targetKey: Target
            requireLOS: true
          services:
            - !type:UtilityService
              id: RangedService
              proto: NearbyGunTargets
              key: Target
# No unnecessary turret spin all the time.

- type: htnCompound
  id: N14RangedHostileCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: N14RangedCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: N14MeleeCombatCompound
# Whole point of making this was to ensure mobs don't roam around freely across the map when they have no targets. Don't change that.

# Raider checkpoint garrison: fight while there is a threat, otherwise walk towards
# NPCBlackboard.FollowTarget. N14RaiderCheckpointSystem sets that target to the
# spawn marker position after 30 seconds without combat, so the guards return home.
- type: htnCompound
  id: N14RaiderCheckpointCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: N14RangedHostileCompound
    - tasks:
        - !type:HTNCompoundTask
          task: N14CaravanWalkCompound

# Raider assault: fight any hostile on the way to the attack point, otherwise walk
# to the FollowTarget set by N14RaiderAssaultSystem (first the point, then random
# wander targets inside the point radius after arrival).
- type: htnCompound
  id: N14RaiderAssaultCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: N14RangedHostileCompound
    - tasks:
        - !type:HTNCompoundTask
          task: N14CaravanWalkCompound
