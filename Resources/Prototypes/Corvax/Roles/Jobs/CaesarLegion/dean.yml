- type: job
  id: CaesarLegionRecruitDean
  setPreference: true
  name: job-name-caesar-legion-recruit-dean
  description: job-description-caesar-legion-recruit-dean
  playTimeTracker: CaesarLegionRecruitDean
  requirements:
  - !type:CharacterSpeciesRequirement
    species:
    - Human
  - !type:CharacterSexRequirement
    sex: Male
  - !type:CharacterGenderRequirement
    gender: Male
  # Forge-Change-Start
  - !type:CharacterDepartmentTimeRequirement
    department: CaesarLegion
    min: 72000 # 20 hours
  - !type:CharacterPlaytimeRequirement
    tracker: CaesarLegionLegionnaireVeteran
    min: 18000 # 5 hours
  # Forge-Change-End
  startingGear: CaesarLegionRecruitDeanGear
  alwaysUseSpawner: true
  icon: "JobIconlegionerDean"
  supervisors: job-name-caesar-legion-supervisors
  canBeAntag: false
  access:
  - CaesarLegion
  - CaesarLegionDean
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - CaesarLegion
      - type: ReplacementAccent
        accent: latin
  - !type:AddTraitSpecial
    traits: [ LanguageLatin ]

- type: startingGear
